
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>IPL Ticket Booking</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="booking.html">Book Ticket</a>
        </nav>
    </header>

    <main>
        <div>
            <section>
                <h2>Ticket Booking Form</h2>
                <p>Fill in your details to book your IPL tickets.</p>

                <form action="#" method="get">

                    <!-- Name -->
                    <label for="name">Full Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        minlength="3"
                        maxlength="40"
                        required>

                    <br><br>

                    <!-- Email -->
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                    <br><br>

                    <!-- Phone -->
                    <label for="phone">Phone Number:</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10-digit mobile number"
                        pattern="[6-9][0-9]{9}"
                        maxlength="10"
                        title="Enter a valid 10-digit Indian mobile number"
                        required>

                    <br><br>

                    <!-- Match Selection -->
                    <label for="match">Select Match:</label>
                    <select id="match" name="match" required>
                        <option value="">-- Select a Match --</option>
                        <option value="CSK vs MI">CSK vs MI</option>
                        <option value="RCB vs KKR">RCB vs KKR</option>
                        <option value="MI vs RCB">MI vs RCB</option>
                        <option value="CSK vs KKR">CSK vs KKR</option>
                        <option value="SRH vs RR">SRH vs RR</option>
                    </select>

                    <br><br>

                    <!-- Stand Category -->
                    <label for="stand">Stand Category:</label>
                    <select id="stand" name="stand" required>
                        <option value="">-- Select Stand --</option>
                        <option value="General">General</option>
                        <option value="Premium">Premium</option>
                        <option value="VIP">VIP</option>
                    </select>

                    <br><br>

                    <!-- Number of Tickets -->
                    <label for="quantity">Number of Tickets:</label>
                    <input
                        type="number"
                        id="quantity"
                        name="quantity"
                        min="1"
                        max="10"
                        required>

                    <br><br>

                    <!-- Additional Preference -->
                    <p>Booking Preference:</p>

                    <input
                        type="radio"
                        id="online"
                        name="preference"
                        value="Online Ticket">
                    <label for="online">Online Ticket</label>

                    <input
                        type="radio"
                        id="counter"
                        name="preference"
                        value="Counter Collection">
                    <label for="counter">Counter Collection</label>

                    <br><br>

                    <!-- Buttons -->
                    <button type="submit">Submit Booking</button>
                    <button type="reset">Reset Form</button>

                </form>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>
    </footer>

</body>
</html>
